name: Check New Booth Profiles

on:
  schedule:
    # 2시간마다 자동 실행 (UTC 기준)
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  check-profiles:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Upload unregistered avatars artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unregistered-avatars-${{ github.run_number }}
          path: unregistered_avatars.txt
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Check for new profiles
        id: check
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cd scripts
          python check_new_profiles.py
      
      - name: Summary
        if: steps.check.outcome == 'failure'
        run: |
          echo "## 🔔 새로운 프로필을 찾았습니다" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Discord 알림을 보냈습니다." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "사이트: https://mochifitter.vr-chat.kr" >> $GITHUB_STEP_SUMMARY
      
      - name: Summary (No new profiles)
        if: steps.check.outcome == 'success'
        run: |
          echo "## ✅ 새로운 프로필이 없습니다" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "모든 프로필이 등록되어 있습니다." >> $GITHUB_STEP_SUMMARY
