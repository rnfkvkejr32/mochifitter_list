name: Check New Booth Profiles

on:
  schedule:
    # 2시간마다 자동 실행 (UTC 기준)
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  check-profiles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for new profiles
        id: check
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MOCHIFITTER_SITE_URL: http://mochi.vr-chat.kr
        run: |
          python scripts/check_new_profiles.py

      - name: Upload unregistered avatars artifact
        if: steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unregistered-avatars-${{ github.run_number }}
          path: unregistered_avatars.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Summary
        if: steps.check.outcome == 'failure'
        run: |
          echo "## 새로운 프로필이 발견되었습니다" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Discord 알림을 전송했습니다." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "미등록 아바타 목록은 이 실행 페이지 하단의 Artifacts에서 다운로드할 수 있습니다." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "사이트: http://mochi.vr-chat.kr" >> $GITHUB_STEP_SUMMARY

      - name: Summary (No new profiles)
        if: steps.check.outcome == 'success'
        run: |
          echo "## ✅ 새로운 프로필이 없습니다" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "모든 프로필이 이미 등록되어 있습니다." >> $GITHUB_STEP_SUMMARY
