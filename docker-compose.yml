services:
  mochifitter_list:
    image: nginx:1.27-alpine
    container_name: mochifitter_list
    restart: unless-stopped

    # 호스트 nginx가 프록시하기 좋게, 로컬로만 바인딩
    ports:
      - "127.0.0.1:13154:80"

    # 이 docker-compose.yaml 파일이 있는 폴더에
    # 리포지토리 파일들(index.html, data/, css/, js/...)이 있어야 합니다.
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    # 정적파일이 잘 뜨는지 간단 체크
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
