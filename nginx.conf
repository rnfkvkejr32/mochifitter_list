server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ✅ 커스텀 404 페이지
  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  # 정적 파일만 제공. 없으면 404로.
  location / {
    try_files $uri $uri/ =404;
  }
  location ~* (^|/)(config\.json|\.env|\.git|\.github|\.claude) {
    return 404;
  }
}
